name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seatudy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seatudy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: seatudy
      JWT_SECRET: ci-only-secret-change-me
      JWT_EXPIRES_IN: 15m
      FRONTEND_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            react-app/package-lock.json

      - name: Install API dependencies
        working-directory: server
        run: npm ci

      - name: Migrate and seed database
        working-directory: server
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run API integration tests
        working-directory: server
        run: |
          node index.js > /tmp/seatudy-api.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:5000/api/health > /dev/null; then break; fi
            sleep 1
          done
          npm test
          cat /tmp/seatudy-api.log

      - name: Install frontend dependencies
        working-directory: react-app
        run: npm ci

      - name: Lint frontend
        working-directory: react-app
        run: npm run lint

      - name: Build frontend
        working-directory: react-app
        run: npm run build
