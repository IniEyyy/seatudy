name: seatudy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seatudy
    volumes:
      - seatudy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seatudy"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  server:
    build: ./server
    restart: unless-stopped
    init: true
    environment:
      PORT: 5000
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: http://localhost:${WEB_PORT:-8080}
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: seatudy
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.docker.example to .env)}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_DAYS: 7
    volumes:
      - seatudy-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./react-app
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  seatudy-db:
  seatudy-uploads:
